apply plugin: 'com.android.application'

def buildVersionCode = (rootProject.findProperty('versionCode') ?: project.findProperty('versionCode') ?: 1) as Integer
def buildVersionName = (rootProject.findProperty('versionName') ?: project.findProperty('versionName') ?: '1.2.0') as String

android {
    namespace 'com.ideabucket.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.ideabucket.app"
        // variables.gradle is the source of truth (24, matching
        // AndroidManifest.xml and check-apk.sh); the hardcoded 25 here had
        // drifted away from both.
        minSdk rootProject.ext.minSdkVersion
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [
                file('src/assets/generated/native-bridge-desktop.js').parentFile,
                'src/assets/generated'
            ]
        }
    }

    testOptions {
        // Print failing tests with full stack traces to the build log — the
        // HTML report never leaves the CI runner, and a bare "6 failed"
        // helps nobody. AGP routes Test task config through here.
        unitTests.all {
            testLogging {
                events 'failed'
                exceptionFormat 'full'
            }
        }
    }

    // Keep the desktop debug build out of Android's variant pipeline so a normal
    // assemble/assembleDebug assembleRelease still builds the real mobile app.
    applicationVariants.all { variant ->
        if (variant.buildType.isDebuggable() && android.namespace == 'com.ideabucket.desktop') {
            variant.ignore = true
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.10.0'  // needed for the native-bridge desktop variant
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Capacitor 8 wires the bridge as a project included from node_modules
    // (capacitor.settings.gradle), not as a Maven artifact — the old
    // 'com.getcapacitor:capacitor-android@6.3.0' line resolved to nothing and
    // pinned a version from the Capacitor 6 era besides.
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
