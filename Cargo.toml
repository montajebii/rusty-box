[workspace]
resolver = "2"
members = ["crates/rustybox-core", "crates/rustybox-server"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/montajebii/rusty-box"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
askama = "0.14"

# dev / integration-test shared deps
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
