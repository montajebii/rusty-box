<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Rusty Box — Drop a thought in. Reach back in for old ones.">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b28a58"/>
      <stop offset="0.5" stop-color="#9a7040"/>
      <stop offset="1" stop-color="#7f5a33"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7040"/>
      <stop offset="1" stop-color="#654629"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4713f"/>
      <stop offset="0.55" stop-color="#a4471d"/>
      <stop offset="1" stop-color="#863716"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- warm paper workbench -->
  <rect width="1200" height="630" fill="#f6f1e7"/>
  <rect width="1200" height="630" fill="#f6f1e7" filter="url(#grain)"/>
  <!-- bench edge -->
  <rect y="596" width="1200" height="34" fill="#654629"/>
  <rect y="592" width="1200" height="6" fill="#322316" opacity="0.35"/>

  <!-- the box, large -->
  <g transform="translate(96 148) scale(3.6)">
    <g transform="rotate(-9 48 34)">
      <rect x="17" y="8" width="62" height="17" rx="4" fill="url(#lid)" stroke="#322316" stroke-width="2.5"/>
      <rect x="24" y="8" width="7" height="17" fill="url(#rust)" stroke="#322316" stroke-width="1.4"/>
      <rect x="65" y="8" width="7" height="17" fill="url(#rust)" stroke="#322316" stroke-width="1.4"/>
    </g>
    <rect x="15" y="26" width="66" height="6" rx="3" fill="#322316"/>
    <rect x="12" y="32" width="72" height="48" rx="5" fill="url(#wood)" stroke="#322316" stroke-width="2.5"/>
    <line x1="15" y1="48" x2="81" y2="48" stroke="#322316" stroke-width="1.2" opacity="0.35"/>
    <line x1="15" y1="64" x2="81" y2="64" stroke="#322316" stroke-width="1.2" opacity="0.35"/>
    <rect x="23" y="32" width="8" height="48" fill="url(#rust)" stroke="#322316" stroke-width="1.4"/>
    <rect x="65" y="32" width="8" height="48" fill="url(#rust)" stroke="#322316" stroke-width="1.4"/>
    <circle cx="27" cy="40" r="1.7" fill="#f6dcc9" opacity="0.85"/>
    <circle cx="27" cy="72" r="1.7" fill="#f6dcc9" opacity="0.85"/>
    <circle cx="69" cy="40" r="1.7" fill="#f6dcc9" opacity="0.85"/>
    <circle cx="69" cy="72" r="1.7" fill="#f6dcc9" opacity="0.85"/>
    <rect x="42" y="56" width="12" height="13" rx="2.5" fill="#5d4a39" stroke="#322316" stroke-width="1.4"/>
    <circle cx="48" cy="61.5" r="2" fill="#241c14"/>
    <rect x="18" y="80" width="10" height="5" rx="1.5" fill="#322316"/>
    <rect x="68" y="80" width="10" height="5" rx="1.5" fill="#322316"/>
  </g>

  <!-- wordmark -->
  <text x="540" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" fill="#241c14" letter-spacing="-2">Rusty Box</text>
  <rect x="544" y="322" width="230" height="5" fill="#a4471d"/>
  <text x="542" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic" fill="#5d4a39">Drop a thought in. Reach back in for old ones.</text>
  <text x="544" y="468" font-family="Menlo, Consolas, monospace" font-size="27" fill="#7f5a33">pure Rust &#183; zero JavaScript &#183; yours, offline</text>
</svg>